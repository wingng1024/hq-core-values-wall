<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Values Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600..900,100,0&display=swap" rel="stylesheet">
<style>
/* Trueno — SIL Open Font License 1.1 (see ../assets/fonts/OFL.txt) */
@font-face{font-family:Trueno;src:url(../assets/fonts/TruenoRg.otf) format("opentype");font-weight:400}
@font-face{font-family:Trueno;src:url(../assets/fonts/TruenoSBd.otf) format("opentype");font-weight:600}
@font-face{font-family:Trueno;src:url(../assets/fonts/TruenoBd.otf) format("opentype");font-weight:700}

:root{
  /* Happy Potato brand palette (Brand Deck 2026) */
  --red:#CC3731; --yellow:#F0B444; --blue:#2E4F9C;
  --cream:#FDF2D2; --navy:#1F3759; --orange:#EF883D;
  --stripe1:#ECB342; --stripe2:#F8DDA8;
  --bg:#FFF8EA; --card:#FFFFFF; --line:#F1E3C2; --ink:#1F3759; --ink2:#4A5B78; --ink3:#8A93A6;
  /* core value colours */
  --chf:#CC3731; --qwc:#2E4F9C; --gve:#3E9B4F; --se:#EF883D; --ot:#1F3759; --gns:#D08F0C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:Trueno,"Helvetica Neue",Arial,sans-serif}
.display{font-family:Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100,"WONK" 0,"opsz" 144;font-weight:900}

#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center center;
  background:var(--bg);display:grid;grid-template-rows:14px 116px 1fr 96px}
.stripes{background:repeating-linear-gradient(90deg,var(--stripe1) 0 56px,var(--stripe2) 56px 112px)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:0 56px}
.brand{display:flex;align-items:center;gap:30px}
.brand img{height:66px;display:block}
.title{display:flex;align-items:center;gap:10px}
.title h1{font-size:46px;color:var(--navy);letter-spacing:.2px;line-height:1}
.title p{font-size:19px;color:var(--ink2);margin-top:6px;font-weight:600}
.spark{width:42px;height:42px;flex:none;margin-top:-14px}
.when{text-align:right}
.when .clock{font-size:50px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.when .date{font-size:19px;color:var(--ink2);font-weight:600;margin-top:4px}

main{display:grid;grid-template-columns:640px 1fr;gap:40px;padding:14px 56px 22px;min-height:0}

/* cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:32px;box-shadow:0 6px 0 var(--line)}
.tab{display:inline-block;background:var(--navy);color:#fff;font-weight:700;font-size:17px;letter-spacing:.5px;
  padding:9px 22px;border-radius:999px}

/* left */
.left{display:flex;flex-direction:column;gap:20px;min-height:0;position:relative}
.board{flex:1;padding:26px 30px 22px;display:flex;flex-direction:column;min-height:0}
.board h2{font-size:38px;color:var(--red);margin-top:14px;line-height:1.05}
.rows{margin-top:16px;display:flex;flex-direction:column;gap:11px;flex:1}
.row{display:grid;grid-template-columns:46px 1fr 64px;align-items:center;gap:14px}
.rank{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;
  background:var(--cream);color:var(--navy);font-family:Fraunces,Georgia,serif;font-weight:900}
.row.top .rank{background:var(--yellow);color:var(--navy);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--yellow)}
.who .name{font-size:25px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;border-radius:8px;background:var(--cream);margin-top:6px;overflow:hidden;display:flex}
.bar span{height:100%}
.count{font-size:34px;text-align:right;color:var(--red);line-height:1}
.rows.two{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(8,auto);column-gap:22px;row-gap:12px;align-content:start}
.rows.two .row{grid-template-columns:36px 1fr 34px;gap:10px}
.rows.two .rank{width:34px;height:34px;font-size:16px}
.rows.two .who .name{font-size:20px}
.rows.two .bar{height:9px;margin-top:5px}
.rows.two .count{font-size:26px}
.rows.two .count small{display:none}
.count small{display:block;font-family:Trueno,sans-serif;font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:1.5px;margin-top:2px}
.boardhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{display:flex;background:var(--cream);border-radius:999px;padding:4px;gap:4px}
.switch button{all:unset;cursor:pointer;font-weight:700;font-size:16px;color:var(--navy);padding:8px 16px;border-radius:999px}
.switch button.on{background:var(--navy);color:#fff}
.month{padding:18px 26px 18px 26px;position:relative}
.month .mhead{display:flex;align-items:baseline;justify-content:space-between}
.month h3{font-size:26px;color:var(--red);line-height:1}
.month .lbl{font-size:15px;font-weight:700;color:var(--orange);letter-spacing:1.2px;text-transform:uppercase}
.top5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.t5{background:var(--cream);border-radius:20px;padding:10px 8px 10px;text-align:center;position:relative}
.t5 .r{width:30px;height:30px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:15px;
  background:#fff;color:var(--navy);font-family:Fraunces,Georgia,serif;font-weight:900}
.t5.first .r{background:var(--yellow)}
.t5 .nm{font-size:17px;font-weight:700;color:var(--navy);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t5 .ct{font-size:24px;color:var(--red);line-height:1.1}
.t5 .ct small{font-family:Trueno,sans-serif;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:1px;margin-left:3px}
.mascot-cheer{position:absolute;right:18px;top:-6px;height:150px;z-index:3;filter:drop-shadow(0 6px 0 rgba(31,55,89,.08))}
.wk{display:inline-flex;align-items:center;padding:9px 18px;border-radius:999px;font-size:18px;font-weight:700;
  background:var(--cream);color:var(--navy);margin-left:auto}
.wk.last{background:#EAF0FA;color:var(--blue)}
.q .qw{float:right;font-family:Trueno,sans-serif;font-size:12px;font-weight:700;color:var(--blue);background:#EAF0FA;border-radius:999px;padding:3px 9px;margin-top:4px}

/* right */
.right{display:grid;grid-template-rows:1fr auto;gap:20px;min-height:0;position:relative}
.feature{position:relative;z-index:2;padding:46px 60px 40px;display:flex;flex-direction:column;overflow:hidden}
.feature .qmark{position:absolute;right:56px;top:6px;font-size:260px;line-height:1;color:var(--accent,var(--red));opacity:.14}
.mascot-love{position:absolute;right:470px;top:-122px;height:178px;z-index:1}
.vals{display:flex;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 22px;border-radius:999px;font-size:20px;font-weight:700;
  background:var(--c);color:#fff;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.pill svg{width:16px;height:16px}
.to{margin-top:28px;font-size:72px;color:var(--navy);line-height:1.02;letter-spacing:-.5px}
.quote{margin-top:22px;font-size:var(--qsize,38px);line-height:1.42;color:var(--ink);flex:1;overflow:hidden}
.from{display:flex;align-items:center;gap:16px;font-size:23px;color:var(--ink2);margin-top:18px;font-weight:600}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;
  font-family:Fraunces,Georgia,serif;font-weight:900;font-size:24px;color:var(--navy)}
.from b{color:var(--navy);font-weight:700}
.counter{font-size:18px;color:var(--ink3);font-weight:700}
.progress{position:absolute;left:0;bottom:0;height:8px;background:var(--accent,var(--red));width:0}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.queue{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.q{padding:16px 22px;height:150px;overflow:hidden;border-radius:24px;border-top:8px solid var(--c)}
.q .qt{font-size:23px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .qf{font-size:15px;color:var(--c);margin-top:3px;font-weight:700}
.q .qm{font-size:16px;color:var(--ink2);margin-top:7px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* footer: the six core values */
footer{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:center;padding:0 56px;
  background:var(--card);border-top:2px solid var(--line)}
.fv{border-left:6px solid var(--c);padding-left:14px}
.fv .t{font-size:20px;color:var(--c);line-height:1.15}
.fv .n{font-size:15px;color:var(--ink2);font-weight:600;margin-top:3px}
.empty{color:var(--ink3);font-size:28px;margin:auto}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list = a => a.length<=1 ? a.join("") : a.slice(0,-1).join(", ")+" & "+a[a.length-1];
const STAR = `<svg viewBox="0 0 16 16"><path d="M8 0l1.9 6.1L16 8l-6.1 1.9L8 16l-1.9-6.1L0 8l6.1-1.9z" fill="#fff"/></svg>`;

function fit(){
  const s=Math.min(innerWidth/1920, innerHeight/1080);
  document.getElementById("stage").style.transform=`translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize",fit); fit();

function tick(){
  const d=new Date();
  clock.textContent=d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  date.textContent=d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
tick(); setInterval(tick,10000);

sub.textContent = DATA.session ? `${DATA.entries.length} sharings from ${DATA.givers} leaders · Happy Together` : "Waiting for the first CV sharing";
boardEyebrow.textContent = `CV Sharing · ${DATA.sessionLabel||""}`;

// leaderboard: this week by default; "Last week" on click, back to this week after 60s
let backTimer;
function board(which){
const list = which==="last" ? DATA.prevWeek : DATA.week;
boardEyebrow.textContent = `CV Sharing · ${(which==="last"?DATA.prevLabel:DATA.sessionLabel)||""}`;
boardTitle.textContent = which==="last" ? "Last week's most recognised" : "Most recognised";
switchEl.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.w===which));
const two = list.length > 8;
const people = list.slice(0, two ? 16 : 8);
rows.classList.toggle("two", two);
const max = Math.max(1,...people.map(p=>p.count));
rows.innerHTML = people.map((p,i)=>{
  const segs = Object.entries(p.values).map(([v,n])=>`<span style="width:${n/p.vtotal*100*p.count/max}%;background:${VC[v]}"></span>`).join("");
  const top = p.count===people[0].count;
  return `<div class="row ${top?"top":""}"><div class="rank">${p.rank}</div>
    <div class="who"><div class="name">${esc(p.name)}</div><div class="bar">${segs}</div></div>
    <div class="count display">${p.count}<small>${p.count>1?"TIMES":"TIME"}</small></div></div>`;
}).join("") || `<div class="empty">No sharing yet</div>`;
}
const switchEl = document.getElementById("switch");
if(!DATA.prevSession) switchEl.style.display="none";
switchEl.addEventListener("click", ev=>{
  const b = ev.target.closest("button"); if(!b) return;
  board(b.dataset.w); clearTimeout(backTimer);
  if(b.dataset.w==="last") backTimer=setTimeout(()=>board("this"),60000);
});
board("this");

// month: top 5 CV achievers
monthEyebrow.textContent = `${DATA.monthLabel} · ${DATA.monthSessions} session${DATA.monthSessions>1?"s":""}`;
monthRow.innerHTML = DATA.month.slice(0,5).map((p,i)=>`<div class="t5 ${p.rank===1?"first":""}"><div class="r">${p.rank}</div>
  <div class="nm">${esc(p.name)}</div><div class="ct display">${p.count}<small>CV</small></div></div>`).join("");

footer.innerHTML = VALUES.map(([v,c])=>`<div class="fv" style="--c:var(${c})"><div class="t display">${v}</div>
  <div class="n">${DATA.valueCounts[v]||0} this week</div></div>`).join("");

// quote carousel
// quotes rotate through this week, then last week
const E = DATA.entries.map(e=>({...e,last:false})).concat((DATA.prevEntries||[]).map(e=>({...e,last:true})));
let idx = 0; const DWELL = 14000;
const wkTag = e => e.last ? `<span class="wk last">Last week · ${esc(DATA.prevLabel)}</span>` : `<span class="wk">This week · ${esc(DATA.sessionLabel)}</span>`;
function render(){
  if(!E.length){feature.innerHTML=`<div class="empty">CV sharing will appear here every Monday</div>`;return}
  const e = E[idx % E.length];
  const accent = VC[e.values[0]] || "var(--red)";
  const len = e.message.length;
  const qsize = len>380?30: len>260?34: len>160?38: 44;
  feature.style.setProperty("--accent",accent);
  feature.style.setProperty("--qsize",qsize+"px");
  feature.innerHTML = `<div class="qmark display">&#8220;</div><div class="fade" style="display:flex;flex-direction:column;height:100%;position:relative">
    <div class="vals">${e.values.map(v=>`<span class="pill" style="--c:${VC[v]}">${STAR}${esc(v)}</span>`).join("")}${wkTag(e)}</div>
    <div class="to display">${esc(list(e.receivers))}</div>
    <div class="quote">${esc(e.message)}</div>
    <div class="from"><div class="avatar">${esc(e.giver[0])}</div><div>Shared by <b>${esc(e.giver)}</b></div>
      <div style="flex:1"></div><div class="counter">${(idx%E.length)+1} / ${E.length}</div></div>
  </div><div class="progress" id="prog"></div>`;
  refit();
  document.getElementById("prog").animate([{width:"0%"},{width:"100%"}],{duration:DWELL,easing:"linear",fill:"forwards"});
  const nxt=[1,2,3].map(k=>E[(idx+k)%E.length]).filter((_,k)=>k<E.length-1);
  queue.innerHTML = nxt.map(n=>`<div class="card q" style="--c:${VC[n.values[0]]}">${n.last?`<span class="qw">Last week</span>`:""}<div class="qt display">${esc(list(n.receivers))}</div>
    <div class="qf">${esc(n.values.join(" + "))} · from ${esc(n.giver)}</div><div class="qm">${esc(n.message)}</div></div>`).join("");
}
function refit(){
  const qel=feature.querySelector(".quote"); if(!qel) return;
  let s=parseFloat(getComputedStyle(qel).fontSize);
  while(s>22 && qel.scrollHeight>qel.clientHeight+1){ s-=2; qel.style.fontSize=s+"px"; }
}
render();
if(document.fonts) document.fonts.ready.then(refit);
setInterval(()=>{idx++;render()},DWELL);
// pick up the morning republish
setTimeout(()=>location.reload(), 30*60*1000);
</script>
</body>
</html>
