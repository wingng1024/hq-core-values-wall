<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Values Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17130f; --panel:#221c16; --panel2:#2b241c; --line:#3a3127;
  --ink:#fbf4e8; --ink2:#c9bba6; --ink3:#8d7f6c; --brand:#f5b335;
  --chf:#ff7a59; --qwc:#5aa9ff; --gve:#5fd38d; --se:#f5b335; --ot:#b58cff; --gns:#3fd0c9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center center;
  display:grid;grid-template-rows:112px 1fr 92px;gap:0;padding:0 56px;
  background:radial-gradient(1200px 700px at 85% 10%,#3a2a12 0%,transparent 60%),var(--bg)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:20px}
.logo{width:56px;height:56px;border-radius:16px;background:var(--brand);display:grid;place-items:center;
  font-weight:800;font-size:30px;color:#2a1c05}
.brand h1{font-size:38px;font-weight:800;letter-spacing:-.5px}
.brand p{font-size:20px;color:var(--ink2);margin-top:2px}
.when{text-align:right}
.when .clock{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.when .date{font-size:20px;color:var(--ink2)}

main{display:grid;grid-template-columns:660px 1fr;gap:48px;padding:36px 0 28px;min-height:0}

/* left */
.left{display:flex;flex-direction:column;gap:24px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px 30px}
.eyebrow{font-size:17px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--brand)}
.card h2{font-size:28px;font-weight:700;margin-top:6px}
.board{flex:1;display:flex;flex-direction:column;min-height:0}
.rows{margin-top:18px;display:flex;flex-direction:column;gap:12px;flex:1}
.row{display:grid;grid-template-columns:44px 1fr 56px;align-items:center;gap:14px}
.rank{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;
  background:var(--panel2);color:var(--ink2)}
.row.top .rank{background:var(--brand);color:#2a1c05}
.who{min-width:0}
.who .name{font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;border-radius:6px;background:var(--panel2);margin-top:7px;overflow:hidden;display:flex}
.bar span{height:100%}
.count{font-size:30px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.count small{display:block;font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:1px}
.month{padding:20px 30px}
.mrow{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.chip{background:var(--panel2);border-radius:999px;padding:8px 16px;font-size:19px;font-weight:600;display:flex;gap:10px;align-items:center}
.chip b{color:var(--brand);font-weight:800}

/* right */
.right{display:grid;grid-template-rows:1fr auto;gap:22px;min-height:0}
.feature{position:relative;background:linear-gradient(160deg,#2e2519,#211a13);border:1px solid var(--line);
  border-radius:32px;padding:56px 64px 48px;display:flex;flex-direction:column;overflow:hidden}
.feature::before{content:"\201C";position:absolute;right:48px;top:-40px;font-size:340px;line-height:1;
  color:var(--accent,var(--brand));opacity:.14;font-family:Georgia,serif}
.feature .vals{display:flex;gap:12px;flex-wrap:wrap}
.vtag{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;font-size:20px;font-weight:700;
  background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.vtag i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.to{margin-top:34px;font-size:64px;font-weight:800;letter-spacing:-1.5px;line-height:1.05}
.quote{margin-top:26px;font-size:var(--qsize,38px);line-height:1.38;color:var(--ink);font-weight:500;flex:1;
  overflow:hidden}
.from{display:flex;align-items:center;gap:16px;font-size:24px;color:var(--ink2);margin-top:20px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;
  font-weight:800;font-size:22px;color:var(--ink)}
.from b{color:var(--ink);font-weight:700}
.progress{position:absolute;left:0;bottom:0;height:6px;background:var(--accent,var(--brand));width:0}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.queue{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 22px;height:150px;overflow:hidden;
  border-top:4px solid var(--c)}
.q .qt{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .qm{font-size:17px;color:var(--ink2);margin-top:8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.q .qf{font-size:15px;color:var(--ink3);margin-top:4px}
.counter{font-size:18px;color:var(--ink3);font-weight:600}

/* footer values */
footer{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;align-items:center;border-top:1px solid var(--line)}
.fv{display:flex;gap:12px;align-items:center}
.fv i{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none}
.fv .t{font-size:17px;font-weight:700;line-height:1.2}
.fv .n{font-size:15px;color:var(--ink3);font-weight:600}
.empty{color:var(--ink3);font-size:28px;margin:auto}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="brand">
      <div class="logo">HP</div>
      <div><h1>Core Values Wall</h1><p id="sub"></p></div>
    </div>
    <div class="when"><div class="clock" id="clock"></div><div class="date" id="date"></div></div>
  </header>
  <main>
    <section class="left">
      <div class="card board">
        <div class="eyebrow" id="boardEyebrow">This week's sharing</div>
        <h2>Most recognised colleagues</h2>
        <div class="rows" id="rows"></div>
      </div>
      <div class="card month">
        <div class="eyebrow" id="monthEyebrow"></div>
        <div class="mrow" id="monthRow"></div>
      </div>
    </section>
    <section class="right">
      <div class="feature" id="feature"></div>
      <div>
        <div class="queue" id="queue"></div>
      </div>
    </section>
  </main>
  <footer id="footer"></footer>
</div>
<script>
const DATA = {"generated": "2026-11-09T20:13", "session": "2026-11-02", "sessionLabel": "Mon 2 Nov 2026", "givers": 5, "entries": [{"id": "2026-11-02-070", "session": "2026-11-02", "giver": "Nadia", "receivers": ["Eddy"], "values": ["Ownership & Teamwork"], "message": "During the preparation of the Jalapeño SOP, the QAQC team did not have sufficient stock available. Eddy willingly supported the team by lending his stock from The Gardens outlet to ensure the SOP preparation could be carried out and completed successfully. Eddy demonstrated great teamwork, cooperation and willingness to support other departments to achieve a common goal."}, {"id": "2026-11-02-071", "session": "2026-11-02", "giver": "Sophia", "receivers": ["Nazrul"], "values": ["Growth Never Stops"], "message": "invented a new method for inventory which is simpler for ops."}, {"id": "2026-11-02-072", "session": "2026-11-02", "giver": "Sophia", "receivers": ["Nur'Ain"], "values": ["Speed & Execution"], "message": "completed various reports on OPEX, Refunable deposit and payment reconcile report before dateline."}, {"id": "2026-11-02-073", "session": "2026-11-02", "giver": "Sophia", "receivers": ["Carmen"], "values": ["Speed & Execution"], "message": "adopted fast to new working environment to generate various graphics for Loaded and Jelapeno."}, {"id": "2026-11-02-074", "session": "2026-11-02", "giver": "Sophia", "receivers": ["Leonard"], "values": ["Speed & Execution"], "message": "managing NPD sessions with new suppliers and products to fulfill the 2027 calendar."}, {"id": "2026-11-02-075", "session": "2026-11-02", "giver": "Sophia", "receivers": ["Wing"], "values": ["Growth Never Stops", "Customer Happiness First"], "message": "arranging and forcing my schedule to meet up with HR system supplier to gain faster decision and execution."}, {"id": "2026-11-02-076", "session": "2026-11-02", "giver": "Sophia", "receivers": ["Lennon"], "values": ["Customer Happiness First"], "message": "Grand opening for Leaning Tower TI, well done!"}, {"id": "2026-11-02-077", "session": "2026-11-02", "giver": "Nur'Ain", "receivers": ["Amira", "Shira"], "values": ["Speed & Execution"], "message": "completed new payment reconcile report for Oct 26 in shortime."}, {"id": "2026-11-02-078", "session": "2026-11-02", "giver": "Nur'Ain", "receivers": ["Shira"], "values": ["Growth Never Stops"], "message": "learned & understood the new template for daily sales report."}, {"id": "2026-11-02-079", "session": "2026-11-02", "giver": "Nur'Ain", "receivers": ["Amira"], "values": ["Ownership & Teamwork"], "message": "directly key in new supplier sabah invoice in system when i pointed out the invoice was not recorded on saturday."}, {"id": "2026-11-02-080", "session": "2026-11-02", "giver": "Nazrul", "receivers": ["Nur'Ain", "Amira", "Shira"], "values": ["Growth Never Stops"], "message": "Start executing the new method for inventory and teaching staff when doing stock take checking"}, {"id": "2026-11-02-081", "session": "2026-11-02", "giver": "Eddy", "receivers": ["Adnin"], "values": ["Speed & Execution"], "message": "Fast response during weekend to follow up staff salary issue."}], "week": [{"name": "Amira", "count": 3, "rank": 1, "values": {"Speed & Execution": 1, "Ownership & Teamwork": 1, "Growth Never Stops": 1}, "vtotal": 3}, {"name": "Shira", "count": 3, "rank": 1, "values": {"Speed & Execution": 1, "Growth Never Stops": 2}, "vtotal": 3}, {"name": "Nur'Ain", "count": 2, "rank": 3, "values": {"Speed & Execution": 1, "Growth Never Stops": 1}, "vtotal": 2}, {"name": "Adnin", "count": 1, "rank": 4, "values": {"Speed & Execution": 1}, "vtotal": 1}, {"name": "Carmen", "count": 1, "rank": 4, "values": {"Speed & Execution": 1}, "vtotal": 1}, {"name": "Eddy", "count": 1, "rank": 4, "values": {"Ownership & Teamwork": 1}, "vtotal": 1}, {"name": "Lennon", "count": 1, "rank": 4, "values": {"Customer Happiness First": 1}, "vtotal": 1}, {"name": "Leonard", "count": 1, "rank": 4, "values": {"Speed & Execution": 1}, "vtotal": 1}, {"name": "Nazrul", "count": 1, "rank": 4, "values": {"Growth Never Stops": 1}, "vtotal": 1}, {"name": "Wing", "count": 1, "rank": 4, "values": {"Growth Never Stops": 1, "Customer Happiness First": 1}, "vtotal": 2}], "valueCounts": {"Ownership & Teamwork": 2, "Growth Never Stops": 4, "Speed & Execution": 5, "Customer Happiness First": 2}, "month": [{"name": "Amira", "count": 3, "rank": 1, "values": {"Speed & Execution": 1, "Ownership & Teamwork": 1, "Growth Never Stops": 1}, "vtotal": 3}, {"name": "Shira", "count": 3, "rank": 1, "values": {"Speed & Execution": 1, "Growth Never Stops": 2}, "vtotal": 3}, {"name": "Nur'Ain", "count": 2, "rank": 3, "values": {"Speed & Execution": 1, "Growth Never Stops": 1}, "vtotal": 2}, {"name": "Adnin", "count": 1, "rank": 4, "values": {"Speed & Execution": 1}, "vtotal": 1}, {"name": "Carmen", "count": 1, "rank": 4, "values": {"Speed & Execution": 1}, "vtotal": 1}, {"name": "Eddy", "count": 1, "rank": 4, "values": {"Ownership & Teamwork": 1}, "vtotal": 1}, {"name": "Lennon", "count": 1, "rank": 4, "values": {"Customer Happiness First": 1}, "vtotal": 1}, {"name": "Leonard", "count": 1, "rank": 4, "values": {"Speed & Execution": 1}, "vtotal": 1}, {"name": "Nazrul", "count": 1, "rank": 4, "values": {"Growth Never Stops": 1}, "vtotal": 1}, {"name": "Wing", "count": 1, "rank": 4, "values": {"Growth Never Stops": 1, "Customer Happiness First": 1}, "vtotal": 2}], "monthLabel": "November", "monthSessions": 1};
const VALUES = [
  ["Customer Happiness First","--chf","Everything starts with the customer"],
  ["Quality Without Compromise","--qwc","Never sacrifice quality"],
  ["Great Value for Everyone","--gve","Exciting, affordable, worth it"],
  ["Speed & Execution","--se","Move fast, improve fast"],
  ["Ownership & Teamwork","--ot","Responsibility, win together"],
  ["Growth Never Stops","--gns","Learn, adapt, upgrade"]
];
const VC = Object.fromEntries(VALUES.map(v=>[v[0],`var(${v[1]})`]));
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list = a => a.length<=1 ? a.join("") : a.slice(0,-1).join(", ")+" & "+a[a.length-1];

function fit(){
  const s=Math.min(innerWidth/1920, innerHeight/1080);
  document.getElementById("stage").style.transform=`translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize",fit); fit();

function tick(){
  const d=new Date();
  clock.textContent=d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  date.textContent=d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
tick(); setInterval(tick,10000);

sub.textContent = DATA.session ? `CV Sharing · ${DATA.sessionLabel} · ${DATA.entries.length} sharings from ${DATA.givers} leaders` : "Waiting for the first CV sharing";
boardEyebrow.textContent = `CV sharing · ${DATA.sessionLabel||""}`;

// leaderboard
const people = DATA.week.slice(0,8);
const max = Math.max(1,...people.map(p=>p.count));
rows.innerHTML = people.map((p,i)=>{
  const segs = Object.entries(p.values).map(([v,n])=>`<span style="width:${n/ p.vtotal*100*p.count/max}%;background:${VC[v]}"></span>`).join("");
  const top = i===0 || p.count===people[0].count;
  return `<div class="row ${top?"top":""}"><div class="rank">${p.rank}</div>
    <div class="who"><div class="name">${esc(p.name)}</div><div class="bar">${segs}</div></div>
    <div class="count">${p.count}<small>${p.count>1?"TIMES":"TIME"}</small></div></div>`;
}).join("") || `<div class="empty">No sharing yet</div>`;

monthEyebrow.textContent = `${DATA.monthLabel} so far · ${DATA.monthSessions} session${DATA.monthSessions>1?"s":""}`;
monthRow.innerHTML = DATA.month.slice(0,6).map(p=>`<div class="chip">${esc(p.name)} <b>${p.count}</b></div>`).join("");

footer.innerHTML = VALUES.map(([v,c,m])=>`<div class="fv" style="--c:var(${c})"><i></i><div><div class="t">${v}</div>
  <div class="n">${DATA.valueCounts[v]||0} this week</div></div></div>`).join("");

// quote carousel
const E = DATA.entries; let idx = 0; const DWELL = 14000;
function render(){
  if(!E.length){feature.innerHTML=`<div class="empty">CV sharing will appear here every Monday</div>`;return}
  const e = E[idx % E.length];
  const accent = VC[e.values[0]] || "var(--brand)";
  const len = e.message.length;
  const qsize = len>380?30: len>260?34: len>160?38: 44;
  feature.style.setProperty("--accent",accent);
  feature.style.setProperty("--qsize",qsize+"px");
  feature.innerHTML = `<div class="fade" style="display:flex;flex-direction:column;height:100%">
    <div class="vals">${e.values.map(v=>`<span class="vtag" style="--c:${VC[v]}"><i></i>${esc(v)}</span>`).join("")}</div>
    <div class="to">${esc(list(e.receivers))}</div>
    <div class="quote">${esc(e.message)}</div>
    <div class="from"><div class="avatar">${esc(e.giver[0])}</div><div>Shared by <b>${esc(e.giver)}</b></div>
      <div style="flex:1"></div><div class="counter">${(idx%E.length)+1} / ${E.length}</div></div>
  </div><div class="progress" id="prog"></div>`;
  const qel=feature.querySelector(".quote");
  for(let s=qsize; s>22 && qel.scrollHeight>qel.clientHeight+1; s-=2) qel.style.fontSize=s-2+"px";
  const p=document.getElementById("prog");
  p.animate([{width:"0%"},{width:"100%"}],{duration:DWELL,easing:"linear",fill:"forwards"});
  const nxt=[1,2,3].map(k=>E[(idx+k)%E.length]).filter((_,k)=>k<E.length-1);
  queue.innerHTML = nxt.map(n=>`<div class="q" style="--c:${VC[n.values[0]]}"><div class="qt">${esc(list(n.receivers))}</div>
    <div class="qf">from ${esc(n.giver)} · ${esc(n.values.join(" + "))}</div><div class="qm">${esc(n.message)}</div></div>`).join("");
}
function refit(){
  const qel=feature.querySelector(".quote"); if(!qel) return;
  let s=parseFloat(getComputedStyle(qel).fontSize);
  while(s>22 && qel.scrollHeight>qel.clientHeight+1){ s-=2; qel.style.fontSize=s+"px"; }
}
render();
if(document.fonts) document.fonts.ready.then(refit);
setInterval(()=>{idx++;render()},DWELL);
// pick up the 6am republish
setTimeout(()=>location.reload(), 30*60*1000);
</script>
</body>
</html>
